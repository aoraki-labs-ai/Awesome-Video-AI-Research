  arxiv: "2502.10248"
  year: 2025
  section: video-gen
  tags: [video, open-weights]
  desc: 30B open model with a deep VAE and an unusually frank limitations section.
  prereq: [hunyuanvideo]
  difficulty: 3
  minutes: 120

- id: pyramid-flow
  title: Pyramidal Flow Matching for Efficient Video Generative Modeling
  arxiv: "2410.05954"
  year: 2024
  section: video-gen
  tags: [video, efficiency, flow]
