  prereq: [dit]
  difficulty: 3
  minutes: 60
  code: https://github.com/Vchitect/Latte

- id: sora
  title: Video generation models as world simulators
  year: 2024
  section: video-gen
  tags: [video, report]
  desc: No method detail, but it established spacetime patches and native-resolution training as the default framing.
  prereq: [dit]
  difficulty: 1
  minutes: 30
  site: https://openai.com/index/video-generation-models-as-world-simulators/

- id: videopoet
  title: "VideoPoet: A Large Language Model for Zero-Shot Video Generation"
  arxiv: "2312.14125"
  year: 2023
  section: video-gen
  tags: [video, autoregressive]
  desc: The autoregressive-token alternative to diffusion; worth reading to see what the diffusion consensus gave up.
