# ─────────────────────────────────────────────────────────────────────────────
# Awesome Video AI Research — paper corpus
#
# This file is the single source of truth. README.md is GENERATED from it:
#     python scripts/gen_readme.py
# Do not hand-edit README.md; edit this file and regenerate.
#
# Scope: generative video (the model that makes the pixels), inference
# efficiency, and post-training. Video understanding / Video-LLM is
# deliberately out of scope — see the placeholder section in taxonomy.yaml.
#
# Fields
#   id          stable slug, referenced by `prereq` and by external tooling
#   title       exact paper title (verified against the arXiv API)
#   arxiv       arXiv id, no version suffix. Omit for non-arXiv work.
#   year        first public release
#   section     which README section it lands in (see taxonomy.yaml)
#   tags        free-form, used for cross-cutting views
#   desc        one line, English, says what it contributes — not what it is
#   prereq      ids you should read first; this is what makes the corpus a
#               learning graph rather than a list
#   difficulty  1 (survey-level) .. 5 (dense theory)
#   minutes     rough first-read budget
#   code        repository url
#   site        project page / report url when there is no arXiv entry
# ─────────────────────────────────────────────────────────────────────────────

papers:

# ── Foundations ──────────────────────────────────────────────────────────────
- id: transformer
  title: Attention Is All You Need
  arxiv: "1706.03762"
  year: 2017
  section: foundations
  tags: [architecture]
  desc: The attention block every model below is built out of.
  prereq: []
  difficulty: 2
  minutes: 60

- id: ddpm
  title: Denoising Diffusion Probabilistic Models
  arxiv: "2006.11239"
  year: 2020
  section: foundations
  tags: [theory, sampling]
  desc: Makes denoising diffusion trainable with a simple noise-prediction loss.
  prereq: []
  difficulty: 3
  minutes: 90
  code: https://github.com/hojonathanho/diffusion

- id: ddim
  title: Denoising Diffusion Implicit Models
  arxiv: "2010.02502"
  year: 2020
  section: foundations
  tags: [sampling]
  desc: Decouples sampling steps from training steps, making few-step sampling possible at all.
  prereq: [ddpm]
  difficulty: 3
  minutes: 60

- id: score-sde
  title: Score-Based Generative Modeling through Stochastic Differential Equations
  arxiv: "2011.13456"
  year: 2020
  section: foundations
  tags: [theory]
  desc: Unifies DDPM and score matching as one SDE, which is where probability-flow ODE samplers come from.
  prereq: [ddpm]
  difficulty: 5
  minutes: 150

- id: cfg
  title: Classifier-Free Diffusion Guidance
  arxiv: "2207.12598"
  year: 2022
  section: foundations
  tags: [sampling, conditioning]
  desc: Trades diversity for prompt adherence with no extra classifier — and doubles inference cost.
  prereq: [ddpm]
  difficulty: 2
  minutes: 30

- id: ldm
  title: High-Resolution Image Synthesis with Latent Diffusion Models
  arxiv: "2112.10752"
  year: 2021
  section: foundations
  tags: [architecture, vae]
  desc: Moves diffusion into a compressed latent space; every model in this list inherits the VAE-plus-denoiser split.
  prereq: [ddpm]
  difficulty: 3
  minutes: 90
  code: https://github.com/CompVis/latent-diffusion

- id: flow-matching
  title: Flow Matching for Generative Modeling
  arxiv: "2210.02747"
  year: 2022
  section: foundations
  tags: [theory, training]
  desc: Replaces the diffusion objective with a straight-line velocity field; current video models train this way, not as DDPMs.
  prereq: [score-sde]
  difficulty: 4
  minutes: 120

- id: rectified-flow
  title: "Flow Straight and Fast: Learning to Generate and Transfer Data with Rectified Flow"
  arxiv: "2209.03003"
  year: 2022
  section: foundations
  tags: [theory, distillation]
  desc: Straightens the generative path so that fewer solver steps lose less quality — the basis of few-step distillation.
  prereq: [flow-matching]
  difficulty: 4
  minutes: 120

- id: edm
  title: Elucidating the Design Space of Diffusion-Based Generative Models
  arxiv: "2206.00364"
  year: 2022
  section: foundations
  tags: [sampling, training]
  desc: Turns sampler and noise schedule design into an explicit parameter space; the source of most sampler names in practice.
  prereq: [score-sde]
  difficulty: 4
  minutes: 150
  code: https://github.com/NVlabs/edm

- id: edm2
  title: Analyzing and Improving the Training Dynamics of Diffusion Models
  arxiv: "2312.02696"
  year: 2023
  section: foundations
  tags: [training]
  desc: Fixes scale drift during training and introduces post-hoc EMA tuning.
  prereq: [edm]
  difficulty: 4
  minutes: 120
  code: https://github.com/NVlabs/edm2

# ── Architectures ────────────────────────────────────────────────────────────
- id: dit
  title: Scalable Diffusion Models with Transformers
  arxiv: "2212.09748"
  year: 2022
  section: architectures
  tags: [architecture, dit]
  desc: Replaces the U-Net with a transformer and introduces adaLN-Zero conditioning; the backbone of every model below.
  prereq: [ldm, transformer]
  difficulty: 3
  minutes: 90
  code: https://github.com/facebookresearch/DiT

- id: uvit
  title: "All are Worth Words: A ViT Backbone for Diffusion Models"
  arxiv: "2209.12152"
  year: 2022
  section: architectures
  tags: [architecture, dit]
  desc: Concurrent transformer backbone that keeps long skip connections; useful contrast to DiT's design choices.
  prereq: [dit]
  difficulty: 3
  minutes: 60

- id: pixart-alpha
  title: "PixArt-α: Fast Training of Diffusion Transformer for Photorealistic Text-to-Image Synthesis"
  arxiv: "2310.00426"
  year: 2023
  section: architectures
  tags: [architecture, training-efficiency]
  desc: Shows a DiT can be trained to competitive quality on a small fraction of the usual compute.
  prereq: [dit]
  difficulty: 3
  minutes: 60

- id: sd3
  title: Scaling Rectified Flow Transformers for High-Resolution Image Synthesis
  arxiv: "2403.03206"
  year: 2024
  section: architectures
  tags: [architecture, dit, flow]
  desc: MMDiT — text and image tokens share one attention with separate weights; the direct ancestor of single-stream video models.
  prereq: [dit, rectified-flow]
  difficulty: 4
  minutes: 120

# ── Video generation ─────────────────────────────────────────────────────────
- id: vdm
